<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.52" stop-color="#071426"/>
      <stop offset="1" stop-color="#0A0D1C"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="70" x2="1050" y2="275" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41D1FF"/>
      <stop offset="0.52" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#C35BFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>

  <circle cx="46" cy="38" r="5" fill="#FF5F57"/>
  <circle cx="64" cy="38" r="5" fill="#FEBC2E"/>
  <circle cx="82" cy="38" r="5" fill="#28C840"/>
  <text x="104" y="43" fill="#7686A2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">leiz@systems:~</text>
  <text x="1050" y="43" fill="#42E6B5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">● ONLINE</text>

  <text x="80" y="142" fill="#F5F7FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">LeiZ</text>
  <rect x="82" y="160" width="280" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)"/>
  <text x="80" y="202" fill="#A8B5CC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="2">SYSTEMS × AI ENGINEERING</text>
  <text x="80" y="240" fill="#E8ECF7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">Building computers from first principles.</text>
  <text x="80" y="276" fill="#6F809D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">OS  /  CONTAINERS  /  NETWORKING  /  DATABASES  /  AI</text>

  <g opacity="0.95">
    <rect x="790" y="91" width="310" height="166" rx="14" fill="#081220" stroke="#243A55"/>
    <text x="816" y="122" fill="#41D1FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$ ./build --from-scratch</text>
    <text x="816" y="153" fill="#9DB0CB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">[OK] kernel      online</text>
    <text x="816" y="178" fill="#9DB0CB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">[OK] runtime     isolated</text>
    <text x="816" y="203" fill="#9DB0CB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">[OK] packets     flowing</text>
    <text x="816" y="228" fill="#9DB0CB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">[OK] models      learning_</text>
    <rect x="816" y="239" width="7" height="13" fill="#C35BFF">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M676 78C726 78 729 63 765 63" stroke="url(#accent)" stroke-opacity="0.5"/>
  <circle cx="676" cy="78" r="3" fill="#41D1FF"/>
  <circle cx="765" cy="63" r="3" fill="#7C5CFF"/>
  <path d="M690 283C752 283 744 300 815 300" stroke="url(#accent)" stroke-opacity="0.32"/>
  <circle cx="690" cy="283" r="3" fill="#7C5CFF"/>
  <circle cx="815" cy="300" r="3" fill="#C35BFF"/>
</svg>